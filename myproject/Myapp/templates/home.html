{% extends 'navbar.html' %}
{% block content %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'Myapp/home.css' %}">
    <div class="main-container">
         
        <h1 class="welcome-msg">WELCOME TO MY HOTEL RESTAURANT</h1>
        <div class="buttons-container">
            {% if user_id %}
                <form action="logout_view">
                    <button type="submit" class="button">LOG OUT</button>
                </form>
            {% else %}
                <form action="login_view">
                    <button type="submit" class="button">LOG IN</button>
                </form>
            {% endif %}
            {% if role == 'manager' %}
            <form action="manager">
                <button type="submit" class="button">VIEW MANAGER</button>
            </form>
            {% else %}
            <form action="menu">
                <button type="submit" class="button">VIEW MENU</button>
            </form>
            <form action="about" target="_blank">
                <button class="button">ABOUT THIS APP</button>
            </form>
            {% endif %}
        </div>
    </div>

{% endblock %}
